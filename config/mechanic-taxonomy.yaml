# Mechanic taxonomy v0 — theme (archetype/slot) and keyword (include/avoid) layers.
# Matchers run at import time against normalized card fields.

tags:
  # --- Theme / slot tags ---
  - id: ramp
    layer: theme
    description: Mana acceleration
    matchers:
      - type: oracle_regex
        pattern: "(?i)(add \\{[WUBRG]\\}|add one mana|add two mana|add three mana|search your library for .{0,40} land|mana rock)"

  - id: draw
    layer: theme
    description: Card advantage
    matchers:
      - type: oracle_regex
        pattern: "(?i)(draw a card|draw two cards|draw three cards|draw four cards|draw X cards|draw cards equal to|draw that many cards|draw the top [0-9]+)"

  - id: removal
    layer: theme
    description: Single-target removal
    matchers:
      - type: oracle_regex
        pattern: "(?i)((?:destroy|exile|sacrifice) target|deals? [0-9]+ damage to (?:any )?target|fight target creature|target creature gets -[0-9]+/-[0-9]+)"

  - id: board_wipe
    layer: theme
    description: Mass removal
    matchers:
      - type: oracle_regex
        pattern: "(?im)^(destroy all (creatures|permanents|nonland permanents|artifacts|enchantments)|exile all (creatures|permanents|artifacts|enchantments)|sacrifice all (creatures|permanents)|all creatures get -[0-9]+/-[0-9]+|deals? [0-9]+ damage to each (creature|player|opponent))"

  - id: wincon
    layer: theme
    description: Win conditions
    matchers:
      - type: oracle_regex
        pattern: "(?i)(you win the game|each opponent loses|can't lose the game|extra turns|take an extra turn|infect|toxic|deal [0-9]+ combat damage to a player|opponents lose half their life|each opponent mills|loses [0-9]+ life for each|power and toughness are each equal to)"

  - id: tokens
    layer: theme
    description: Token creation
    matchers:
      - type: oracle_regex
        pattern: "(?i)(create .{0,30} token)"

  - id: aristocrats
    layer: theme
    description: Sacrifice synergies
    matchers:
      - type: oracle_regex
        pattern: "(?i)(sacrifice (a |another |each )?(creature|permanent)|when(ever)? .+ dies)"

  - id: landfall
    layer: theme
    description: Landfall triggers
    matchers:
      - type: keyword
        value: Landfall

  - id: recursion
    layer: theme
    description: Graveyard recursion
    matchers:
      - type: oracle_regex
        pattern: "(?i)(return .+ from (your )?graveyard|cast .+ from your graveyard)"

  - id: voltron
    layer: theme
    description: Equipment and aura support
    matchers:
      - type: type_regex
        pattern: "(Equipment|Aura)"
      - type: oracle_regex
        pattern: "(?i)(equipped creature|enchant creature|enchantment.?aura)"

  - id: enchantress
    layer: theme
    description: Enchantment density and cast triggers
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever you cast an enchantment spell"

  # --- Keyword mechanics (include / avoid wizard) ---
  - id: flying
    layer: keyword
    matchers:
      - type: keyword
        value: Flying

  - id: trample
    layer: keyword
    matchers:
      - type: keyword
        value: Trample

  - id: first_strike
    layer: keyword
    matchers:
      - type: keyword
        value: First strike

  - id: double_strike
    layer: keyword
    matchers:
      - type: keyword
        value: Double strike

  - id: deathtouch
    layer: keyword
    matchers:
      - type: keyword
        value: Deathtouch

  - id: lifelink
    layer: keyword
    matchers:
      - type: keyword
        value: Lifelink

  - id: menace
    layer: keyword
    matchers:
      - type: keyword
        value: Menace

  - id: hexproof
    layer: keyword
    matchers:
      - type: keyword
        value: Hexproof

  - id: indestructible
    layer: keyword
    matchers:
      - type: keyword
        value: Indestructible

  - id: vigilance
    layer: keyword
    matchers:
      - type: keyword
        value: Vigilance

  - id: haste
    layer: keyword
    matchers:
      - type: keyword
        value: Haste

  - id: reach
    layer: keyword
    matchers:
      - type: keyword
        value: Reach

  - id: scry
    layer: keyword
    matchers:
      - type: keyword
        value: Scry
      - type: oracle_regex
        pattern: "(?i)scry [0-9]+"

  - id: surveil
    layer: keyword
    description: Surveil and discover (graveyard filler)
    matchers:
      - type: oracle_regex
        pattern: "(?i)\\b(?:surveil|discover)\\b"

  - id: energy
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)(\\{E\\}|energy counter)"

  - id: experience
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)experience counter"

  - id: blood
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)blood counter"

  - id: rad
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)rad counter"

  - id: oil
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)oil counter"

  - id: charge
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)charge counter"

  - id: counters
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)(\\+1/\\+1 counter|proliferate)"

  - id: vehicles
    layer: keyword
    matchers:
      - type: type_regex
        pattern: "Vehicle"

  - id: partner
    layer: keyword
    matchers:
      - type: oracle_regex
        pattern: "(?i)(partner with|partner —|partners with|choose a background|doctor's companion|^partner\\b)"

  - id: flash
    layer: keyword
    matchers:
      - type: keyword
        value: Flash

  - id: cascade
    layer: keyword
    matchers:
      - type: keyword
        value: Cascade

  - id: equip
    layer: keyword
    matchers:
      - type: keyword
        value: Equip
