# Effect pattern registry — D0 contract for dependency extraction (see planning/10, planning/14).
# Pattern id (source) → effect_kind; payload is static or built from regex capture groups.

schema_version: 1
extraction_version: 1

# Face policy: planning/14-effect-extraction-face-policy.md
# v1 import uses merged oracle_text (// separated), face_index always 0.

patterns:
  # --- search_library (tutor / search) ---
  - id: search_library_basic_land
    effect_kind: search_library
    confidence: 1.0
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |up to \\w+ )?basic land"
    payload:
      types: [land]
      supertypes: [basic]

  - id: search_library_land
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an |up to \\w+ )?(?:[\\w'-]+\\s+)*land card"
    payload:
      types: [land]
    exclude_if_matched:
      - search_library_basic_land

  - id: search_library_creature_cmc
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?creature card with mana value (\\d+) or less"
    payload:
      types: [creature]
    capture:
      max_cmc: 1

  - id: search_library_creature_cmc_min
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?creature card with mana value (\\d+) or greater"
    payload:
      types: [creature]
    capture:
      min_cmc: 1
    exclude_if_matched:
      - search_library_creature_cmc

  - id: search_library_colored_creature
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?(white|blue|black|red|green) creature card"
    payload:
      types: [creature]
    capture:
      color_word: 1
    exclude_if_matched:
      - search_library_creature_cmc
      - search_library_creature_cmc_min

  - id: search_library_land_subtype
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?(Forest|Island|Mountain|Plains|Swamp) card"
    payload:
      types: [land]
    capture:
      subtypes: 1
    exclude_if_matched:
      - search_library_basic_land
      - search_library_land

  - id: search_library_creature_or_planeswalker
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library(?: and/or graveyard)? for (?:a |an )?creature or planeswalker card"
    payload:
      types: [creature, planeswalker]
      type_match: any

  - id: search_library_creature
    effect_kind: search_library
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an |up to \\d+ )?creature cards?"
    payload:
      types: [creature]
    exclude_if_matched:
      - search_library_creature_cmc
      - search_library_creature_cmc_min
      - search_library_colored_creature
      - search_library_creature_or_planeswalker

  - id: search_library_aura
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?Aura card"
    payload:
      types: [enchantment]
      subtypes: [Aura]

  - id: search_library_artifact_or_enchantment
    effect_kind: search_library
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?artifact or enchantment card"
    payload:
      types: [artifact, enchantment]
      type_match: any

  - id: search_library_enchantment
    effect_kind: search_library
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?enchantment card"
    payload:
      types: [enchantment]
    exclude_if_matched:
      - search_library_artifact_or_enchantment

  - id: search_library_artifact
    effect_kind: search_library
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?artifact card"
    payload:
      types: [artifact]
    exclude_if_matched:
      - search_library_artifact_or_enchantment

  - id: search_library_any_card
    effect_kind: search_library
    confidence: 0.5
    matchers:
      - type: oracle_regex
        pattern: "(?i)search your library for (?:a |an )?card(?:,|\\b)"
    payload:
      any_card: true
    exclude_if_matched:
      - search_library_land
      - search_library_basic_land
      - search_library_creature
      - search_library_creature_cmc
      - search_library_aura
      - search_library_enchantment
      - search_library_artifact

  # --- energy (consume before produce in file order; produce excludes consume) ---
  - id: energy_consume
    effect_kind: energy_consume
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)pay (?:\\d+ )?\\{E\\}"
    payload:
      resource: energy
      min_cost: 1

  - id: energy_produce
    effect_kind: energy_produce
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)(you get \\{E\\}|you get [^.\\n]*energy counters?|get [^.\\n]*energy counters?)"
    payload:
      resource: energy
    exclude_if_matched:
      - energy_consume

  # --- experience counters ---
  - id: experience_produce
    effect_kind: experience_produce
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)(you get (?:an )?experience counter|get (?:an )?experience counter)"
    payload:
      resource: experience

  - id: experience_consume
    effect_kind: experience_consume
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)((?:for each|equal to the number of|per) experience counter|experience counters? you have)"
    payload:
      resource: experience

  # --- blood counters (on players) ---
  - id: blood_produce
    effect_kind: blood_produce
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)((?:put|place)s? .{0,50}blood counters? on)"
    payload:
      resource: blood

  - id: blood_consume
    effect_kind: blood_consume
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)(for each blood counter|blood counters? (?:an )?opponent has|blood counters? on (?:each )?opponent)"
    payload:
      resource: blood
    exclude_if_matched:
      - blood_produce

  # --- +1/+1 counters ---
  - id: plus_one_produce
    effect_kind: plus_one_produce
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)(put (?:a |one |\\d+ )?\\+1/\\+1 counters?|\\+1/\\+1 counters? (?:are |would be )put|proliferate)"
    payload:
      resource: plus_one

  - id: plus_one_consume
    effect_kind: plus_one_consume
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)(with (?:a |one |\\d+ )?\\+1/\\+1 counters?|remove .{0,40}\\+1/\\+1 counters?)"
    payload:
      resource: plus_one

  # --- type / subtype payoffs ---
  - id: buff_subtype_other
    effect_kind: buff_subtype
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "[Oo]ther ([A-Z][a-z]+s) you control"
    payload: {}
    capture:
      subtypes_plural: 1

  - id: whenever_cast_aura
    effect_kind: whenever_cast_aura
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever you cast an Aura"
    payload:
      types: [enchantment]
      subtypes: [Aura]

  - id: whenever_cast_enchantment
    effect_kind: whenever_cast_enchantment
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever you cast an enchantment spell"
    payload:
      types: [enchantment]
    exclude_if_matched:
      - whenever_cast_aura

  - id: whenever_cast_type
    effect_kind: whenever_cast_type
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever you cast an? ([A-Za-z]+) spell"
    payload: {}
    capture:
      types: 1
    exclude_if_matched:
      - whenever_cast_aura
      - whenever_cast_enchantment

  # --- tokens (payoff before produce; aristocrats fodder also counts token_produce in code) ---
  - id: token_payoff_on_create
    effect_kind: token_payoff
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever you create (?:a |an |one or more )?token"
    payload:
      trigger: create

  - id: token_payoff_on_enter
    effect_kind: token_payoff
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever (?:a |another |each |one or more )?(?:\\w+ )*tokens? (?:enters?|enter)(?: the battlefield)?"
    payload:
      trigger: enter
    exclude_if_matched:
      - token_payoff_on_create

  - id: token_payoff_for_each
    effect_kind: token_payoff
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)for each (?:token|tokens) you control"
    payload:
      trigger: count

  - id: token_payoff_tokens_you_control
    effect_kind: token_payoff
    confidence: 0.85
    matchers:
      - type: oracle_regex
        pattern: "(?i)(?:number of|amount of) tokens you control|tokens you control (?:get|have|gain)"
    payload:
      trigger: control
    exclude_if_matched:
      - token_payoff_for_each

  - id: token_doubler_or_replacement
    effect_kind: token_replacement
    confidence: 1.0
    matchers:
      - type: oracle_regex
        pattern: "(?i)(?:if an effect would create|creates twice that many)"
    payload:
      role: modifier

  - id: token_produce
    effect_kind: token_produce
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)create (?:a |an |two |three |four |five |\\d+/\\d+ |one or more |any number of )?(?:[\\w'/.-]+ )*token"
    payload:
      role: producer
    exclude_if_matched:
      - token_doubler_or_replacement
      - token_payoff_on_create
      - token_payoff_on_enter
      - token_payoff_for_each
      - token_payoff_tokens_you_control

  # --- sacrifice / aristocrats (payoff before outlet; outlet excludes payoffs) ---
  - id: sacrifice_opponent_forced
    effect_kind: sacrifice_opponent
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)(?:each (?:other )?player|opponents?) sacrifices"
    payload:
      role: opponent

  - id: sacrifice_opponent_that_player
    effect_kind: sacrifice_opponent
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)that player sacrifices"
    payload:
      role: opponent
    exclude_if_matched:
      - sacrifice_opponent_forced

  - id: death_recursion_persist
    effect_kind: death_recursion
    confidence: 1.0
    matchers:
      - type: oracle_regex
        pattern: "(?i)\\bpersist\\b"
    payload:
      mechanic: persist

  - id: death_recursion_undying
    effect_kind: death_recursion
    confidence: 1.0
    matchers:
      - type: oracle_regex
        pattern: "(?i)\\bundying\\b"
    payload:
      mechanic: undying

  - id: death_recursion_escape
    effect_kind: death_recursion
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)(?:may cast|cast).{0,120}from (?:your )?graveyard|escape—"
    payload:
      mechanic: escape

  - id: sacrifice_creature_dies_payoff
    effect_kind: sacrifice_payoff
    confidence: 0.95
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever (?:a |another |each )?(?:[\\w'-]+ )*(?:creature|permanent)(?: you control)? dies"
    payload:
      trigger: dies

  - id: sacrifice_any_creature_dies
    effect_kind: sacrifice_payoff
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)whenever a creature dies"
    payload:
      trigger: dies
    exclude_if_matched:
      - sacrifice_creature_dies_payoff

  - id: sacrifice_on_sacrifice_payoff
    effect_kind: sacrifice_payoff
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)when(ever)? you sacrifice"
    payload:
      trigger: sacrifice

  - id: sacrifice_outlet
    effect_kind: sacrifice_outlet
    confidence: 0.9
    matchers:
      - type: oracle_regex
        pattern: "(?i)(?:you may )?sacrifice (?:a |an |another |each |one or more |one of your )(?:[\\w'-]+ )*(creature|permanent|artifact)"
    payload:
      role: outlet
    exclude_if_matched:
      - sacrifice_creature_dies_payoff
      - sacrifice_any_creature_dies
      - sacrifice_on_sacrifice_payoff
      - sacrifice_opponent_forced
      - sacrifice_opponent_that_player

  - id: sacrifice_fodder_token
    effect_kind: sacrifice_fodder
    confidence: 0.85
    matchers:
      - type: oracle_regex
        pattern: "(?i)create (?:a |an |two |three |four |five |\\d+/\\d+ |one or more |any number of )?(?:[\\w'/.-]+ )*token"
    payload:
      role: fodder
    exclude_if_matched:
      - token_produce
      - token_doubler_or_replacement
      - token_payoff_on_create
      - token_payoff_on_enter
      - token_payoff_for_each
      - token_payoff_tokens_you_control

  # --- type line (not oracle) ---
  - id: type_line_aura
    effect_kind: type_line_aura
    confidence: 1.0
    matchers:
      - type: type_regex
        pattern: "(?i)Enchantment — Aura"
    payload:
      types: [enchantment]
      subtypes: [Aura]

  - id: type_line_vehicle
    effect_kind: type_line_vehicle
    confidence: 1.0
    matchers:
      - type: type_regex
        pattern: "Vehicle"
    payload:
      types: [artifact]
      subtypes: [Vehicle]
