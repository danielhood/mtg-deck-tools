# Mechanic profiles for dependency balance and user-facing focus presets.
# Consumed by the dependency engine (planned) and documented in:
# planning/11-dependency-engine-user-experience.md
#
# focus_presets multiply defaults; criteria.mechanic_focus selects a preset per profile.

schema_version: 1

focus_presets:
  incidental:
    share_multiplier: 0.5
    description: Splash — mechanic appears but is not a main plan
  supported:
    share_multiplier: 1.0
    description: Mechanic should work when drawn; typical Commander support package
  focused:
    share_multiplier: 1.5
    description: Main secondary plan; higher counts and share
  engine:
    share_multiplier: 2.0
    description: Deck built around this mechanic; suppress over-cap warnings unless user lowers cap

profiles:
  # Audit 2026-05-30 (30,969 commander-legal): 55 producers, 84 consumers; see audit-evidence-20260530.json
  energy:
    label: Energy counters
    activation:
      include_mechanics: [energy]
    roles: [producer, consumer]
    defaults:
      producer_min: 2
      producer_max: 6
      consumer_min: 2
      consumer_max: 8
      share_max: 0.12
      consumer_per_producer_min: 0.5

  # Audit 2026-05-30: 1,220 aura spells (type_line), 7 aura tutors extracted
  aura_support:
    label: Auras
    activation:
      themes: [voltron]
    roles: [aura_spell, aura_payoff]
    defaults:
      aura_spell_min: 6
      aura_spell_max: 15
      share_max: 0.18

  # Audit 2026-05-30: 662 elf creatures, 9 other-elf payoffs (buff_subtype)
  elves:
    label: Elf tribal
    activation:
      include_mechanics: []
    roles: [subtype_payoff, subtype_creature]
    defaults:
      subtype: Elf
      payoff_creature_min: 5
      share_max: 0.25

  # Audit 2026-05-30: 23 whenever-cast-artifact payoffs (partial coverage)
  artifacts:
    label: Artifacts matter
    activation:
      include_mechanics: [equip, vehicles]
    roles: [artifact_spell, artifact_payoff]
    defaults:
      artifact_min: 8
      share_max: 0.22

  sacrifice:
    label: Sacrifice / aristocrats
    activation:
      themes: [aristocrats]
    roles: [outlet, fodder, payoff]
    defaults:
      outlet_min: 2
      payoff_min: 3
      fodder_min: 8
