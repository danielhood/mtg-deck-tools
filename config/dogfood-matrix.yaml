# Repeatable dependency / validation analysis matrix.
# Run: mtg-deck-tools analyze run [--write-decks]
# Requires: mtg-deck-tools import (cards.db + card_effects)

schema_version: 1

defaults:
  seed: 42

scenarios:
  # --- Goodstuff / unrelated (post-calibration: no deck-level aura/energy noise) ---
  - id: tokens-muldrotha
    label: Tokens (Muldrotha) — no unrelated profile warnings
    commander_names: ["Muldrotha, the Gravetide"]
    criteria:
      themes: [tokens]
      colors: [B, G]
    expect:
      validation:
        passed: true
      dependency:
        rules_must_not_warn: [AURA_SUPPORT_MIN, ENCHANTMENT_SUPPORT_MIN, ENERGY_BALANCE, EXPERIENCE_BALANCE, BLOOD_BALANCE, PLUS_ONE_BALANCE, TOKEN_BALANCE, REANIMATION_SUPPORT, GRAVEYARD_COST_SUPPORT, SELF_MILL_BALANCE, EQUIPMENT_BALANCE, LANDFALL_BALANCE, RAD_BALANCE, OIL_BALANCE, CHARGE_BALANCE]
        max_inappropriate_warnings: 0

