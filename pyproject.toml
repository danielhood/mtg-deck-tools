[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-deck-tools"
version = "0.1.0"
description = "Local Commander deck builder for Magic: The Gathering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "questionary>=2.1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
]

[project.scripts]
mtg-deck-tools = "mtg_deck_tools.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_deck_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
