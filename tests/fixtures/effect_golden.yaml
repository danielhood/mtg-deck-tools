  - name: migloz_oil
    oracle_text: "Migloz enters with five oil counters on it.\n{1}, Remove an oil counter from Migloz: It gains vigilance and menace until end of turn.\n{2}, Remove two oil counters from Migloz: It gets +2/+2 until end of turn.\n{3}, Remove three oil counters from Migloz: Destroy target artifact or enchantment."
    type_line: "Legendary Creature — Phyrexian Beast"
    expected:
      - effect_kind: oil_produce
        source: oil_produce
      - effect_kind: oil_consume
        source: oil_consume

  - name: coalition_relic
    oracle_text: "{T}: Add one mana of any color.\n{T}: Put a charge counter on this artifact.\nAt the beginning of your first main phase, remove all charge counters from this artifact. Add one mana of any color for each charge counter removed this way."
    type_line: "Artifact"
    expected:
