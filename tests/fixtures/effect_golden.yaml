      - effect_kind: mill_enabler
        source: mill_enabler_surveil_discover

  - name: scholarly_discovery
    oracle_text: "Discover 4"
    type_line: "Sorcery"
    expected:
      - effect_kind: mill_enabler
        source: mill_enabler_surveil_discover

  - name: faithless_looting
    oracle_text: "Draw two cards, then discard two cards."
    type_line: "Sorcery"
    expected:
      - effect_kind: mill_enabler
        source: graveyard_filler_discard

  - name: saproling_symbiosis
    oracle_text: "For each creature card in your graveyard, create a 1/1 green Saproling creature token."
    type_line: "Sorcery"
    expected_min:
      - effect_kind: graveyard_payoff
        source: graveyard_payoff
      - effect_kind: token_produce
        source: token_produce

  - name: omnath_locus_of_rage
    oracle_text: "Landfall — Whenever a land enters the battlefield under your control, create a 5/5 red Elemental creature token."
    type_line: "Legendary Creature — Elemental"
    expected_min:
      - effect_kind: landfall_payoff
        source: landfall_payoff
      - effect_kind: token_produce
        source: token_produce

  - name: rampant_growth
    oracle_text: "Search your library for a basic land card, put that card onto the battlefield tapped, then shuffle."
    type_line: "Sorcery"
    expected_min:
      - effect_kind: search_library
        source: search_library_basic_land
      - effect_kind: land_ramp
        source: land_ramp

  - name: wise_mothman
    oracle_text: "Flying\nWhenever The Wise Mothman enters or attacks, each player gets a rad counter.\nWhenever one or more nonland cards are milled, put a +1/+1 counter on each of up to X target creatures, where X is the number of nonland cards milled this way."
    type_line: "Legendary Creature — Insect Mutant"
    expected_min:
      - effect_kind: rad_produce
        source: rad_produce

  - name: mariposa_military_base
    oracle_text: "You may have this land enter tapped. If you do, you get two rad counters.\n{T}: Add {C}.\n{5}, {T}: Draw a card. This ability costs {1} less to activate for each rad counter you have."
    type_line: "Land"
    expected:
      - effect_kind: rad_produce
        source: rad_produce
      - effect_kind: rad_consume
