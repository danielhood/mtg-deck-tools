# Golden oracle texts for effect extraction (D0). Run via tests/test_effect_extraction.py

cases:
  - name: rampant_growth
    oracle_text: "Search your library for a basic land card, reveal it, put it into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_basic_land
        payload:
          types: [land]
          supertypes: [basic]

  - name: cultivate
    oracle_text: "Search your library for up to two basic land cards, put them onto the battlefield tapped, then shuffle."
    type_line: "Sorcery"
    expected_min:
      - effect_kind: search_library
        source: search_library_basic_land
      - effect_kind: land_ramp
        source: land_ramp

  - name: elvish_vanguard
    oracle_text: "Other Elves you control get +1/+1."
    type_line: "Creature — Elf Warrior"
    expected:
      - effect_kind: buff_subtype
        source: buff_subtype_other
        payload:
          subtypes: [Elf]

  - name: aether_hub
    oracle_text: "Whenever a land enters the battlefield under your control, you get {E} (an energy counter)."
    type_line: "Land"
    expected:
      - effect_kind: energy_produce
        source: energy_produce

  - name: enlightened_tutor
    oracle_text: "Search your library for an artifact or enchantment card, reveal it, put it into your hand, then shuffle."
    type_line: "Instant"
    expected:
      - effect_kind: search_library
        source: search_library_artifact_or_enchantment
        payload:
          types: [artifact, enchantment]

  - name: worldly_tutor
    oracle_text: "Search your library for a creature card, reveal it, put it into your hand, then shuffle."
    type_line: "Instant"
    expected:
      - effect_kind: search_library
        source: search_library_creature
        payload:
          types: [creature]

  - name: chord_cmc_capture
    oracle_text: "Search your library for a creature card with mana value 3 or less, put it onto the battlefield, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_creature_cmc
        payload:
          max_cmc: 3

  - name: idyllic_tutor
    oracle_text: "Search your library for an enchantment card, reveal it, put it into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_enchantment

  - name: fabricate
    oracle_text: "Search your library for an artifact card, reveal it, put it into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_artifact

  - name: shade_of_aura
    oracle_text: "Enchant creature"
    type_line: "Enchantment — Aura"
    expected:
      - effect_kind: type_line_aura
        source: type_line_aura

  - name: ethereal_armor_aura_cast
    oracle_text: "Whenever you cast an Aura spell, draw a card."
    type_line: "Creature"
    expected:
      - effect_kind: whenever_cast_aura
        source: whenever_cast_aura
        payload:
          types: [enchantment]
          subtypes: [Aura]

  - name: enchantress_presence
    oracle_text: "Whenever you cast an enchantment spell, draw a card."
    type_line: "Enchantment"
    expected:
      - effect_kind: whenever_cast_enchantment
        source: whenever_cast_enchantment
        payload:
          types: [enchantment]

  - name: sai_master_thopterist
    oracle_text: "Whenever you cast an artifact spell, create a 1/1 colorless Thopter artifact creature token with flying."
    type_line: "Legendary Creature — Human Artificer"
    expected:
      - effect_kind: whenever_cast_type
        source: whenever_cast_type
        payload:
          types: [artifact]
      - effect_kind: token_produce
        source: token_produce

  - name: token_payoff_create
    oracle_text: "Whenever you create a token, draw a card."
    type_line: "Creature"
    expected:
      - effect_kind: token_payoff
        source: token_payoff_on_create

  - name: token_payoff_enter
    oracle_text: "Whenever a token enters the battlefield, each opponent loses 1 life."
    type_line: "Creature"
    expected:
      - effect_kind: token_payoff
        source: token_payoff_on_enter

  - name: token_payoff_for_each
    oracle_text: "For each token you control, each opponent loses 1 life."
    type_line: "Enchantment"
    expected:
      - effect_kind: token_payoff
        source: token_payoff_for_each

  - name: lightning_bolt
    oracle_text: "Lightning Bolt deals 3 damage to any target."
    type_line: "Instant"
    expected: []

  - name: sol_ring
    oracle_text: "{T}: Add {C}{C}."
    type_line: "Artifact"
    expected: []

  - name: demonic_tutor
    oracle_text: "Search your library for a card, put that card into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_any_card
        payload:
          any_card: true

  - name: energy_produce_only
    oracle_text: "Pay {E}{E}: Draw a card."
    type_line: "Creature"
    expected:
      - effect_kind: energy_consume
        source: energy_consume

  - name: aetherstorm_roc
    oracle_text: "Flying\nWhenever this creature or another creature you control enters, you get {E} (an energy counter).\nWhenever this creature attacks, you may pay {E}{E}. If you do, put a +1/+1 counter on it and tap up to one target creature defending player controls."
    type_line: "Creature — Bird"
    expected_min:
      - effect_kind: energy_produce
        source: energy_produce
      - effect_kind: energy_consume
        source: energy_consume

  - name: nissa_worldsoul_speaker
    oracle_text: "Landfall — Whenever a land you control enters, you get {E}{E} (two energy counters).\nYou may pay eight {E} rather than pay the mana cost for permanent spells you cast."
    type_line: "Legendary Creature — Elf Druid"
    expected_min:
      - effect_kind: energy_produce
        source: energy_produce
      - effect_kind: energy_consume
        source: energy_consume

  - name: attune_with_aether
    oracle_text: "Search your library for a basic land card and a card named Aether Hub, reveal them, put them into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_basic_land

  - name: regal_force
    oracle_text: "Other Elves you control get +1/+1 for each Elf you control."
    type_line: "Creature — Elf"
    expected:
      - effect_kind: buff_subtype
        source: buff_subtype_other

  - name: sylvan_tutor
    oracle_text: "Search your library for a creature card, reveal it, put it into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_creature

  - name: kenrith_buff
    oracle_text: "Other creatures you control get +1/+1."
    type_line: "Legendary Creature — Human Noble"
    expected: []

  - name: ashnods_altar
    oracle_text: "Sacrifice a creature: Add {C}{C}."
    type_line: "Artifact"
    expected:
      - effect_kind: sacrifice_outlet
        source: sacrifice_outlet

  - name: blood_artist
    oracle_text: "Whenever a creature dies, Blood Artist deals 1 damage to that creature's controller and you gain 1 life."
    type_line: "Creature — Vampire"
    expected:
      - effect_kind: sacrifice_payoff
        source: sacrifice_creature_dies_payoff

  - name: zulaport_cutthroat
    oracle_text: "Whenever another creature you control dies, each opponent loses 1 life and you gain 1 life."
    type_line: "Creature — Human Rogue Ally"
    expected:
      - effect_kind: sacrifice_payoff
        source: sacrifice_creature_dies_payoff

  - name: nest_invader
    oracle_text: "When Nest Invader enters the battlefield, create a 0/1 colorless Eldrazi Spawn creature token with \"Sacrifice this creature: Add {C}.\""
    type_line: "Creature — Eldrazi Drone"
    expected:
      - effect_kind: token_produce
        source: token_produce

  - name: grave_pact
    oracle_text: "Whenever a creature you control dies, each other player sacrifices a creature of their choice."
    type_line: "Enchantment"
    expected:
      - effect_kind: sacrifice_payoff
        source: sacrifice_creature_dies_payoff
      - effect_kind: sacrifice_opponent
        source: sacrifice_opponent_forced

  - name: butcher_gnarl
    oracle_text: "Persist (When this creature dies, if it had no -1/-1 counters on it, return it to the battlefield under its owner's control with a -1/-1 counter on it.)"
    type_line: "Creature — Beast"
    expected:
      - effect_kind: death_recursion
        source: death_recursion_persist

  - name: gravecrawler
    oracle_text: "You may cast Gravecrawler from your graveyard as long as you control a Zombie."
    type_line: "Creature — Zombie"
    expected:
      - effect_kind: death_recursion
        source: death_recursion_escape

  - name: vindictive_wrench
    oracle_text: "Sacrifice an artifact. If you do, destroy target artifact."
    type_line: "Instant"
    expected:
      - effect_kind: sacrifice_outlet
        source: sacrifice_outlet

  - name: smugglers_copter
    oracle_text: "Flying\nWhenever Smuggler's Copter attacks or blocks, you may draw a card. If you do, discard a card.\nCrew 1"
    type_line: "Artifact — Vehicle"
    expected:
      - effect_kind: type_line_vehicle
        source: type_line_vehicle
        payload:
          types: [artifact]
          subtypes: [Vehicle]

  - name: sword_of_fire_and_ice
    oracle_text: "Equipped creature gets +2/+2 and has protection from red and from blue.\nWhenever equipped creature deals combat damage to a player, Sword of Fire and Ice deals 2 damage to any target and you draw a card.\nEquip {2}"
    type_line: "Artifact — Equipment"
    expected:
      - effect_kind: whenever_equipped
        source: whenever_equipped_payoff
      - effect_kind: type_line_equipment
        source: type_line_equipment
        payload:
          types: [artifact]
          subtypes: [Equipment]

  - name: kor_duelist
    oracle_text: "First strike\nWhenever equipped creature deals damage to a blocked creature, destroy that creature. You may attach an Equipment you control to this creature."
    type_line: "Creature — Kor Soldier"
    expected:
      - effect_kind: whenever_equipped
        source: whenever_equipped_payoff

  - name: chief_of_the_foundry
    oracle_text: "Other Vehicles you control get +1/+1."
    type_line: "Creature — Artificer"
    expected:
      - effect_kind: buff_subtype
        source: buff_subtype_other
        payload:
          subtypes: [Vehicle]

  - name: double_search_creature
    oracle_text: "Search your library for a creature card, then search your library for a land card."
    type_line: "Sorcery"
    expected_min:
      - effect_kind: search_library
        source: search_library_creature
      - effect_kind: search_library
        source: search_library_land

  - name: green_suns_zenith
    oracle_text: "Search your library for a green creature card, reveal it, put it into your hand, then shuffle."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_colored_creature
        payload:
          types: [creature]
          colors: [G]

  - name: natures_lore
    oracle_text: "Search your library for a Forest card, put it onto the battlefield, then shuffle."
    type_line: "Sorcery"
    expected_min:
      - effect_kind: search_library
        source: search_library_land_subtype
        payload:
          types: [land]
          subtypes: [Forest]
      - effect_kind: land_ramp
        source: land_ramp

  - name: fierce_empath
    oracle_text: "When Fierce Empath enters the battlefield, you may search your library for a creature card with mana value 6 or greater, reveal it, put it into your hand, then shuffle."
    type_line: "Creature — Elf"
    expected:
      - effect_kind: search_library
        source: search_library_creature_cmc_min
        payload:
          types: [creature]
          min_cmc: 6

  - name: finale_of_devastation
    oracle_text: "Search your library and/or graveyard for a creature or planeswalker card with mana value X or less and put it onto the battlefield."
    type_line: "Sorcery"
    expected:
      - effect_kind: search_library
        source: search_library_creature_or_planeswalker
        payload:
          types: [creature, planeswalker]
          type_match: any

  - name: mizzix_experience
    oracle_text: "Whenever you cast an instant or sorcery spell with mana value greater than the number of experience counters you have, you get an experience counter.\nInstant and sorcery spells you cast cost {1} less to cast for each experience counter you have."
    type_line: "Legendary Creature — Goblin Wizard"
    expected:
      - effect_kind: experience_produce
        source: experience_produce
      - effect_kind: experience_consume
        source: experience_consume

  - name: yawgmoth_blood
    oracle_text: "Whenever a creature dies, you may pay 1 life. If you do, each opponent loses 1 life and you gain 1 life.\n{2}, Pay 1 life: Put a blood counter on target opponent."
    type_line: "Legendary Creature — Human Cleric"
    expected_min:
      - effect_kind: blood_produce
        source: blood_produce
      - effect_kind: sacrifice_payoff
        source: sacrifice_creature_dies_payoff

  - name: font_of_agonies
    oracle_text: "Whenever you pay life, put that many blood counters on this enchantment.\n{1}{B}, Remove four blood counters from this enchantment: Destroy target creature."
    type_line: "Enchantment"
    expected:
      - effect_kind: blood_produce
        source: blood_produce
      - effect_kind: blood_consume
        source: blood_consume

  - name: bloodletter_quill
    oracle_text: "{2}, {T}, Put a blood counter on this artifact: Draw a card, then you lose 1 life for each blood counter on this artifact.\n{U}{B}: Remove a blood counter from this artifact."
    type_line: "Artifact"
    expected:
      - effect_kind: blood_produce
        source: blood_produce
      - effect_kind: blood_consume
        source: blood_consume

  - name: hardened_scales
    oracle_text: "If one or more +1/+1 counters would be put on a creature you control, that many plus one +1/+1 counters are put on it instead."
    type_line: "Enchantment"
    expected:
      - effect_kind: plus_one_produce
        source: plus_one_produce

  - name: ozolith
    oracle_text: "Whenever a creature you control leaves the battlefield, if it had counters on it, put those counters on The Ozolith.\nAt the beginning of combat on your turn, if The Ozolith has counters on it, you may move all counters from The Ozolith onto target creature."
    type_line: "Legendary Artifact"
    expected: []

  - name: walking_ballista
    oracle_text: "Walking Ballista enters the battlefield with X +1/+1 counters on it.\n{4}: Put a +1/+1 counter on Walking Ballista."
    type_line: "Artifact Creature — Construct"
    expected:
      - effect_kind: plus_one_produce
        source: plus_one_produce

  - name: animate_dead
    oracle_text: "Return target creature card from your graveyard to the battlefield."
    type_line: "Enchantment — Aura"
    expected_min:
      - effect_kind: reanimate
        source: reanimate_return
      - effect_kind: type_line_aura
        source: type_line_aura

  - name: snapcaster_mage
    oracle_text: "Flash\nWhen Snapcaster Mage enters the battlefield, target instant or sorcery card in your graveyard gains flashback until end of turn."
    type_line: "Creature — Human Wizard"
    expected:
