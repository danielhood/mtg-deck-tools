# MTG Deck Tools — API + web UI in one container.
# First start downloads Scryfall oracle bulk and imports cards.db (several minutes).
#
# Requires Traefik on the external `proxy` network (see docker-reverse-proxy).
# LAN clients: http://mtg-deck-tools.deck-build.lan (DNS → Docker host running Traefik)
#
# Standalone without Traefik: uncomment `ports` below.

services:
  mtg-deck-tools:
    build: .
    container_name: mtg-deck-tools
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mtg-deck-tools.rule=Host(`deck-build.lan`)
      - traefik.http.routers.mtg-deck-tools.entrypoints=web
      - traefik.http.services.mtg-deck-tools.loadbalancer.server.port=8000
    volumes:
      - mtg-data:/data
    environment:
      MTG_SERVE_HOST: "0.0.0.0"
      MTG_SERVE_PORT: "8000"
      MTG_DB_PATH: /data/cards.db
      MTG_DECKS_PATH: /data/decks.db
      MTG_AUTO_DOWNLOAD: "1"
    # ports:
    #   - "8000:8000"

networks:
  proxy:
    external: true

volumes:
  mtg-data:
