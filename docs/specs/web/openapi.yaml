openapi: 3.1.0
info:
  title: MTG Deck Tools API
  description: HTTP surface for the MTG Deck Tools engine. Validation and deck rules
    run server-side; clients send DeckCriteria and receive .deck.json-shaped documents.
  version: 0.1.0
paths:
  /api/v1/wizard/meta:
    get:
      tags:
      - wizard
      summary: Wizard Meta
      operationId: wizard_meta_api_v1_wizard_meta_get
      parameters:
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardMetaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wizard/themes:
    get:
      tags:
      - wizard
      summary: Wizard Themes
      operationId: wizard_themes_api_v1_wizard_themes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ThemeChoiceResponse'
                type: array
                title: Response Wizard Themes Api V1 Wizard Themes Get
  /api/v1/wizard/slot-template/defaults:
    get:
      tags:
      - wizard
      summary: Wizard Slot Template Defaults
      operationId: wizard_slot_template_defaults_api_v1_wizard_slot_template_defaults_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotTemplateDefaultsResponse'
  /api/v1/wizard/mechanics:
    get:
      tags:
      - wizard
      summary: Wizard Mechanics
      operationId: wizard_mechanics_api_v1_wizard_mechanics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MechanicChoiceResponse'
                type: array
                title: Response Wizard Mechanics Api V1 Wizard Mechanics Get
  /api/v1/wizard/synergy-context:
    post:
      tags:
      - wizard
      summary: Wizard Synergy Context
      operationId: wizard_synergy_context_api_v1_wizard_synergy_context_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCriteria'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynergyContextResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wizard/preflight:
    post:
      tags:
      - wizard
      summary: Wizard Preflight
      operationId: wizard_preflight_api_v1_wizard_preflight_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckCriteria'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wizard/commanders/search:
    get:
      tags:
      - wizard
      summary: Wizard Commanders Search
      operationId: wizard_commanders_search_api_v1_wizard_commanders_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Commander name substring
          default: ''
          title: Q
        description: Commander name substring
      - name: colors
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: WUBRG color filter
          default: []
          title: Colors
        description: WUBRG color filter
      - name: color_match
        in: query
        required: false
        schema:
          type: string
          description: includes or exact
          default: includes
          title: Color Match
        description: includes or exact
      - name: card_price_min_usd
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Card Price Min Usd
      - name: card_price_max_usd
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Card Price Max Usd
      - name: budget_usd
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          title: Budget Usd
      - name: strict_budget
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Strict Budget
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 15
          title: Limit
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommanderSearchResult'
                title: Response Wizard Commanders Search Api V1 Wizard Commanders
                  Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/wizard/rarities:
    get:
      tags:
      - wizard
      summary: Wizard Rarities
      operationId: wizard_rarities_api_v1_wizard_rarities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RarityChoiceResponse'
                type: array
                title: Response Wizard Rarities Api V1 Wizard Rarities Get
  /api/v1/decks:
    get:
      tags:
      - library
      summary: List Decks
      operationId: list_decks_api_v1_decks_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search name, commander, or themes
          title: Q
        description: Search name, commander, or themes
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: saved_at, name, or commander
          default: saved_at
          title: Sort
        description: saved_at, name, or commander
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      - name: decks
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Saved deck library path
          title: Decks
        description: Saved deck library path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeckLibraryEntry'
                title: Response List Decks Api V1 Decks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decks/{deck_id}:
    get:
      tags:
      - library
      summary: Get Deck
      operationId: get_deck_api_v1_decks__deck_id__get
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: string
          title: Deck Id
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      - name: decks
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Saved deck library path
          title: Decks
        description: Saved deck library path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckLibraryDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - library
      summary: Patch Deck
      operationId: patch_deck_api_v1_decks__deck_id__patch
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: string
          title: Deck Id
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      - name: decks
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Saved deck library path
          title: Decks
        description: Saved deck library path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDeckRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckLibraryDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - library
      summary: Delete Deck
      operationId: delete_deck_api_v1_decks__deck_id__delete
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: string
          title: Deck Id
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      - name: decks
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Saved deck library path
          title: Decks
        description: Saved deck library path
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decks/{deck_id}/refill-slot:
    post:
      tags:
      - library
      summary: Refill Deck Slot
      operationId: refill_deck_slot_api_v1_decks__deck_id__refill_slot_post
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: string
          title: Deck Id
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      - name: decks
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Saved deck library path
          title: Decks
        description: Saved deck library path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefillSlotRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckLibraryDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/decks/{deck_id}/swap:
    post:
      tags:
      - library
      summary: Swap Deck Cards
      operationId: swap_deck_cards_api_v1_decks__deck_id__swap_post
      parameters:
      - name: deck_id
        in: path
        required: true
        schema:
          type: string
          title: Deck Id
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      - name: decks
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Saved deck library path
          title: Decks
        description: Saved deck library path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapCardsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapCardsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - meta
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/stats:
    get:
      tags:
      - database
      summary: Stats
      operationId: stats_api_v1_stats_get
      parameters:
      - name: db
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: SQLite database path
          title: Db
        description: SQLite database path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/import:
    post:
      tags:
      - database
      summary: Import Cards
      operationId: import_cards_api_v1_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/generate:
    post:
      tags:
      - deck
      summary: Generate
      operationId: generate_api_v1_generate_post
      parameters:
      - name: include_markdown
        in: query
        required: false
        schema:
          type: boolean
          description: Include markdown in response (CLI/export; not persisted)
          default: false
          title: Include Markdown
        description: Include markdown in response (CLI/export; not persisted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/generate/from-deck:
    post:
      tags:
      - deck
      summary: Generate From Deck
      operationId: generate_from_deck_api_v1_generate_from_deck_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFromDeckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActivatedProfileResponse:
      properties:
        profile_id:
          type: string
          title: Profile Id
        prompt_label:
          type: string
          title: Prompt Label
        current_level:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Level
        focus_options:
          items:
            $ref: '#/components/schemas/FocusLevelOption'
          type: array
          title: Focus Options
      type: object
      required:
      - profile_id
      - prompt_label
      title: ActivatedProfileResponse
    CommanderSearchResult:
      properties:
        oracle_id:
          type: string
          title: Oracle Id
        name:
          type: string
          title: Name
        type_line:
          type: string
          title: Type Line
          default: ''
        color_identity:
          items:
            type: string
          type: array
          title: Color Identity
        partner_kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Partner Kind
        edhrec_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Edhrec Rank
        price_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Price Usd
        price_known:
          type: boolean
          title: Price Known
          default: false
        released_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Released At
        image_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Uri
        rarity:
          anyOf:
          - type: string
          - type: 'null'
          title: Rarity
      type: object
      required:
      - oracle_id
      - name
      title: CommanderSearchResult
    CriteriaWarningResponse:
      properties:
        rule_id:
          type: string
          title: Rule Id
        message:
          type: string
          title: Message
      type: object
      required:
      - rule_id
      - message
      title: CriteriaWarningResponse
    DatabaseStatsResponse:
      properties:
        db_path:
          type: string
          title: Db Path
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
        total_cards:
          type: integer
          title: Total Cards
        commander_eligible:
          type: integer
          title: Commander Eligible
        with_partner:
          type: integer
          title: With Partner
        tag_assignments:
          type: integer
          title: Tag Assignments
        distinct_tags:
          type: integer
          title: Distinct Tags
        effect_rows:
          type: integer
          title: Effect Rows
          default: 0
        distinct_effect_kinds:
          type: integer
          title: Distinct Effect Kinds
          default: 0
        top_tags:
          items:
            $ref: '#/components/schemas/TopTagRow'
          type: array
          title: Top Tags
      type: object
      required:
      - db_path
      - total_cards
      - commander_eligible
      - with_partner
      - tag_assignments
      - distinct_tags
      title: DatabaseStatsResponse
    DeckCriteria:
      properties:
        themes:
          items:
            type: string
          type: array
          title: Themes
        include_mechanics:
          items:
            type: string
          type: array
          title: Include Mechanics
        avoid_mechanics:
          items:
            type: string
          type: array
          title: Avoid Mechanics
        colors:
          items:
            type: string
          type: array
          title: Colors
        commander_oracle_ids:
          items:
            type: string
          type: array
          title: Commander Oracle Ids
        budget_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Budget Usd
        card_price_min_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Card Price Min Usd
        card_price_max_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Card Price Max Usd
        strict_budget:
          type: boolean
          title: Strict Budget
          default: false
        strict_dependencies:
          type: boolean
          title: Strict Dependencies
          default: false
        repair_dependencies:
          type: boolean
          title: Repair Dependencies
          default: false
        mechanic_focus:
          additionalProperties:
            type: string
          type: object
          title: Mechanic Focus
        prefer_available:
          type: boolean
          title: Prefer Available
          default: false
        min_rarity:
          type: string
          title: Min Rarity
          default: common
        slot_template:
          additionalProperties:
            type: integer
          type: object
          title: Slot Template
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
      type: object
      title: DeckCriteria
      description: "User selections from the deck wizard \u2014 consumed by the builder\
        \ (Phase 2+)."
    DeckLibraryDetailResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        saved_at:
          type: string
          title: Saved At
        deck:
          additionalProperties: true
          type: object
          title: Deck
      type: object
      required:
      - id
      - name
      - saved_at
      - deck
      title: DeckLibraryDetailResponse
    DeckLibraryEntry:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        saved_at:
          type: string
          title: Saved At
        commander_names:
          items:
            type: string
          type: array
          title: Commander Names
        commander_image_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Commander Image Uri
        colors:
          items:
            type: string
          type: array
          title: Colors
        themes:
          items:
            type: string
          type: array
          title: Themes
        estimated_price_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Estimated Price Usd
      type: object
      required:
      - id
      - name
      - saved_at
      title: DeckLibraryEntry
    FocusLevelOption:
      properties:
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        label:
          type: string
          title: Label
        dots:
          type: integer
          title: Dots
      type: object
      required:
      - value
      - label
      - dots
      title: FocusLevelOption
    GenerateFromDeckRequest:
      properties:
        deck_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Deck Path
        deck:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Deck
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        db_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Db Path
        output_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Dir
        refill_slot:
          anyOf:
          - type: string
          - type: 'null'
          title: Refill Slot
        strict_budget:
          type: boolean
          title: Strict Budget
          default: false
        strict_dependencies:
          type: boolean
          title: Strict Dependencies
          default: false
        repair_dependencies:
          type: boolean
          title: Repair Dependencies
          default: false
        prefer_available:
          type: boolean
          title: Prefer Available
          default: false
      type: object
      title: GenerateFromDeckRequest
      description: Regenerate from an existing .deck.json document (API) or server
        path (CLI).
    GenerateRequest:
      properties:
        criteria:
          anyOf:
          - $ref: '#/components/schemas/DeckCriteria'
          - type: 'null'
        colors:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Colors
        themes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Themes
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        db_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Db Path
        output_dir:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Dir
        stub:
          type: boolean
          title: Stub
          default: false
        strict_budget:
