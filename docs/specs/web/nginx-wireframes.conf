server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional directory listing when no index.html in a subfolder
    autoindex off;

    # Wireframes are static planning assets — disable caching during review
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
