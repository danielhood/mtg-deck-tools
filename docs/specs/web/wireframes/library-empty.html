<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wireframe — Saved library empty (UX7f draft)</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --blue-900: #1e3a5f;
      --blue-700: #2563eb;
      --blue-100: #dbeafe;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --magenta: #c026d3;
      --frame-width: 375px;
      --touch-min: 44px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      background: #e2e8f0;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .preview-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .frame {
      width: var(--frame-width);
      min-height: 667px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .app-brand { display: flex; align-items: center; gap: 10px; }
    .app-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--blue-700), var(--magenta));
    }
    .app-title { font-size: 15px; font-weight: 700; color: var(--blue-900); }
    .app-subtitle { font-size: 11px; color: var(--text-muted); }
    .library-pill {
      font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 999px; background: var(--blue-100); color: var(--blue-700);
    }
    .library-toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--surface);
    }
    .search-field {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: var(--touch-min);
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      opacity: 0.6;
    }
    .search-field input {
      flex: 1;
      border: none;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-muted);
      background: transparent;
    }
    .search-icon { font-size: 14px; color: var(--text-muted); }
    .sort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      opacity: 0.6;
    }
    .sort-label { font-size: 12px; color: var(--text-muted); }
    .sort-select {
      flex: 1;
      max-width: 200px;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      background: var(--bg);
      color: var(--text-muted);
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 16px;
    }
    .empty-illustration {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      border: 2px dashed var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: var(--text-muted);
      opacity: 0.5;
    }
    .empty-state h2 {
      font-size: 18px;
      color: var(--blue-900);
    }
    .empty-state p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 260px;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--touch-min);
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: var(--blue-700);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 8px;
    }
    .library-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .btn-outline {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: var(--touch-min);
      width: 100%;
      border-radius: 10px;
      border: 2px solid var(--blue-700);
      background: var(--bg);
      color: var(--blue-700);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .wireframe-meta {
      max-width: var(--frame-width);
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .wireframe-meta a { color: var(--blue-700); }
  </style>
</head>
<body>
  <p class="preview-label">375px · UX7f draft · library empty</p>
  <div class="frame">
    <header class="app-header">
      <div class="app-brand">
        <div class="app-mark" aria-hidden="true"></div>
        <div>
          <div class="app-title">MTG Deck Tools</div>
          <div class="app-subtitle">Saved decks</div>
        </div>
      </div>
      <span class="library-pill">Library</span>
    </header>

    <div class="library-toolbar" aria-hidden="true">
      <label class="search-field">
        <span class="search-icon">⌕</span>
        <input type="search" placeholder="Search name, commander, themes…" disabled>
      </label>
      <div class="sort-row">
        <span class="sort-label">Sort</span>
        <select class="sort-select" disabled><option>Saved (newest)</option></select>
      </div>
    </div>

    <main class="empty-state">
      <div class="empty-illustration" aria-hidden="true">📚</div>
      <h2>No saved decks yet</h2>
      <p>Build a deck with the wizard — it saves automatically when generation finishes.</p>
      <a class="btn-primary" href="build-step-01-themes.html">Build new deck</a>
    </main>

    <footer class="library-footer">
      <a class="btn-outline" href="home.html">← Home</a>
    </footer>
  </div>
  <aside class="wireframe-meta">
    Route: <code>/library</code> · State: empty ·
    <a href="library.html">populated grid</a> · Spec: screens.md § Saved deck library
  </aside>
</body>
</html>
